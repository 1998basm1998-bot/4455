<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روم المحبة البسيطة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div class="app-container" id="appContainer">
        <div class="header">
            <button class="settings-trigger" id="settingsBtn">
                <i class="fa-solid fa-gear"></i>
            </button>
            <h2>روم المحبة البسيطة 💖</h2>
            <p id="statusText">جاري الاتصال...</p>
        </div>

        <div class="stage">
            <div class="slot-wrapper"><div class="mic-slot" id="slot-0" data-index="0"><i class="fa-solid fa-crown"></i></div><div class="slot-name" id="name-0">فارغ</div></div>
            <div class="slot-wrapper"><div class="mic-slot" id="slot-1" data-index="1"><i class="fa-solid fa-crown"></i></div><div class="slot-name" id="name-1">فارغ</div></div>
            <div class="slot-wrapper"><div class="mic-slot" id="slot-2" data-index="2"><i class="fa-solid fa-crown"></i></div><div class="slot-name" id="name-2">فارغ</div></div>
            <div class="slot-wrapper"><div class="mic-slot" id="slot-3" data-index="3"><i class="fa-solid fa-crown"></i></div><div class="slot-name" id="name-3">فارغ</div></div>
        </div>

        <div class="chat-area" id="chatArea"></div>

        <div class="input-area">
            <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالتك هنا...">
            <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>

        <div style="display: none;">
            <audio id="audio-0" autoplay playsinline></audio>
            <audio id="audio-1" autoplay playsinline></audio>
            <audio id="audio-2" autoplay playsinline></audio>
            <audio id="audio-3" autoplay playsinline></audio>
        </div>

        <div class="settings-overlay" id="settingsOverlay">
            <div class="settings-box">
                <div class="settings-header">
                    <h3>خلفيات الروم الملكية ✨</h3>
                    <button id="closeSettingsBtn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="backgrounds-grid">
                    <div class="bg-option" data-bg="https://g.top4top.io/p_3787y2p7w1.jpg" style="background-image: url('https://g.top4top.io/p_3787y2p7w1.jpg')"></div>
                    <div class="bg-option" data-bg="https://f.top4top.io/p_3787ctm0n1.jpg" style="background-image: url('https://f.top4top.io/p_3787ctm0n1.jpg')"></div>
                    <div class="bg-option" data-bg="https://h.top4top.io/p_3787b1dnu1.jpg" style="background-image: url('https://h.top4top.io/p_3787b1dnu1.jpg')"></div>
                    <div class="bg-option" data-bg="https://i.top4top.io/p_3787b202z1.jpg" style="background-image: url('https://i.top4top.io/p_3787b202z1.jpg')"></div>
                    <div class="bg-option" data-bg="https://k.top4top.io/p_3787pptdi1.jpg" style="background-image: url('https://k.top4top.io/p_3787pptdi1.jpg')"></div>
                    <div class="bg-option" data-bg="https://f.top4top.io/p_3787c8wpz1.jpg" style="background-image: url('https://f.top4top.io/p_3787c8wpz1.jpg')"></div>
                    <div class="bg-option" data-bg="https://g.top4top.io/p_3787vhhv21.jpg" style="background-image: url('https://g.top4top.io/p_3787vhhv21.jpg')"></div>
                    <div class="bg-option default-bg" data-bg="none">الافتراضية</div>
                </div>
            </div>
        </div>
    </div>

    <div class="custom-modal-overlay" id="customModal">
        <div class="custom-modal-box">
            <h3 id="modalTitle">تنبيه</h3>
            <p id="modalMessage">رسالة التنبيه هنا</p>
            <div class="modal-buttons">
                <button id="modalBtnYes" class="btn-yes">موافق</button>
                <button id="modalBtnNo" class="btn-no">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
