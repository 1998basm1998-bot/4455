<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الروم الصوتي - Live Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* نفس التصميم السابق الجميل */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0b0f19; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; }
        .app-container { width: 100%; max-width: 400px; height: 100vh; max-height: 850px; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .header { padding: 20px; text-align: center; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); z-index: 10; }
        .header h2 { font-size: 1.2rem; margin-bottom: 5px; color: #f8fafc; }
        .header p { font-size: 0.8rem; color: #94a3b8; }
        .stage { padding: 30px 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; justify-items: center; background: rgba(0, 0, 0, 0.2); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .mic-slot { width: 60px; height: 60px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); border: 2px dashed rgba(255, 255, 255, 0.2); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; position: relative; }
        .mic-slot i { font-size: 1.2rem; color: #64748b; }
        .mic-slot.active { background: linear-gradient(135deg, #3b82f6, #06b6d4); border: 2px solid #00d2ff; box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }
        .mic-slot.active i { color: #fff; }
        .slot-name { font-size: 0.7rem; margin-top: 5px; color: #cbd5e1; text-align: center; width: 100%; }
        .slot-wrapper { display: flex; flex-direction: column; align-items: center; }
        .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .message { max-width: 80%; display: flex; flex-direction: column; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg-sender { font-size: 0.7rem; color: #94a3b8; margin-bottom: 3px; margin-right: 5px;}
        .msg-bubble { background: rgba(255, 255, 255, 0.1); padding: 10px 15px; border-radius: 15px 15px 0 15px; font-size: 0.9rem; line-height: 1.4; color: #f1f5f9; word-wrap: break-word;}
        .message.mine { align-self: flex-end; }
        .message.mine .msg-bubble { background: #3b82f6; border-radius: 15px 15px 15px 0; color: #fff; }
        .message.mine .msg-sender { display: none; }
        .input-area { padding: 15px; background: rgba(15, 23, 42, 0.9); border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; gap: 10px; align-items: center; }
        .chat-input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 12px 15px; border-radius: 25px; font-size: 0.9rem; outline: none; transition: 0.3s; }
        .chat-input:focus { border-color: #3b82f6; background: rgba(255,255,255,0.1); }
        .send-btn { background: #3b82f6; color: #fff; border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .send-btn:hover { background: #2563eb; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h2>الروم الصوتي العام 🎙️</h2>
            <p>المتواجدون: 2 شخص</p>
        </div>

        <div class="stage">
            <div class="slot-wrapper"><div class="mic-slot" id="slot-0"><i class="fa-solid fa-plus"></i></div><div class="slot-name" id="name-0">فارغ</div></div>
            <div class="slot-wrapper"><div class="mic-slot" id="slot-1"><i class="fa-solid fa-plus"></i></div><div class="slot-name" id="name-1">فارغ</div></div>
            <div class="slot-wrapper"><div class="mic-slot" id="slot-2"><i class="fa-solid fa-plus"></i></div><div class="slot-name" id="name-2">فارغ</div></div>
            <div class="slot-wrapper"><div class="mic-slot" id="slot-3"><i class="fa-solid fa-plus"></i></div><div class="slot-name" id="name-3">فارغ</div></div>
        </div>

        <div class="chat-area" id="chatArea">
            </div>

        <div class="input-area">
            <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالتك هنا...">
            <button class="send-btn" id="sendBtn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script type="module">
        // 1. استدعاء مكتبات الفايربيس (التطبيق + قاعدة البيانات اللحظية)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 2. إعدادات مشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyArg6aPnPyd0x5C2HbZ8o5wpVmhmmSYS6Q",
            authDomain: "fn1998.firebaseapp.com",
            projectId: "fn1998",
            storageBucket: "fn1998.firebasestorage.app",
            messagingSenderId: "326727010464",
            appId: "1:326727010464:web:831654b2593ae59d5821c5",
            measurementId: "G-8W5C8ZXJZE"
        };

        // 3. تهيئة التطبيق وقاعدة البيانات
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // إنشاء "مسار" في قاعدة البيانات نسميه room-messages
        const messagesRef = ref(db, 'room-messages');

        // عناصر الواجهة
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatArea = document.getElementById('chatArea');

        // إنشاء اسم عشوائي للمستخدم (لكي نميز من الذي أرسل الرسالة)
        // في المستقبل يمكنك جعله يسجل دخوله باسمه الحقيقي
        const myName = "ضيف_" + Math.floor(Math.random() * 1000);

        // 4. دالة إرسال الرسالة إلى Firebase
        function sendMessage() {
            const text = chatInput.value.trim();
            if (text === "") return;

            // إرسال البيانات لقاعدة البيانات
            push(messagesRef, {
                sender: myName,
                text: text,
                timestamp: Date.now()
            });

            chatInput.value = ""; // تفريغ الحقل
        }

        // تفعيل الإرسال عند الضغط على الزر أو زر Enter
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 5. الاستماع الدائم للرسائل القادمة من Firebase وعرضها للجميع
        onChildAdded(messagesRef, (snapshot) => {
            const data = snapshot.val();
            displayMessage(data.sender, data.text);
        });

        // دالة رسم الرسالة على الشاشة
        function displayMessage(sender, text) {
            const messageDiv = document.createElement('div');
            
            // إذا كان مرسل الرسالة هو أنا، اجعلها زرقاء وعلى اليمين
            if (sender === myName) {
                messageDiv.className = 'message mine';
                messageDiv.innerHTML = `<div class="msg-bubble">${text}</div>`;
            } else {
                // إذا كان المرسل شخص آخر، أظهر اسمه واجعلها رمادية على اليسار
                messageDiv.className = 'message';
                messageDiv.innerHTML = `
                    <div class="msg-sender">${sender}</div>
                    <div class="msg-bubble">${text}</div>
                `;
            }

            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight; // النزول للأسفل تلقائياً
        }
    </script>
</body>
</html>
